# Builds the firmware for both board variants and publishes the web installer,
# firmware and PC scripts to GitHub Pages (https://magnuskeel.github.io/claude-mon/).
name: Build and publish

on:
  push:
    branches: [master]
    paths: ['firmware/**', 'host/**', 'site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware -e cyd

      - name: Assemble site
        run: |
          version=$(grep -oP 'FW_VERSION "\K[^"]+' firmware/src/version.h)
          mkdir -p _site/firmware/cyd
          cp site/index.html _site/
          cp firmware/.pio/build/cyd/{bootloader,partitions,firmware}.bin _site/firmware/cyd/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin _site/firmware/cyd/
          # Version every URL so browsers never install a cached older build.
          sed -e "s/__VERSION__/$version/" -e "s|\.bin\"|.bin?v=$version\"|" site/manifest.json > _site/manifest.json
          sed -i "s|manifest=\"manifest.json\"|manifest=\"manifest.json?v=$version\"|" _site/index.html
          grep -q "manifest.json?v=$version" _site/index.html
          python3 -m json.tool _site/manifest.json > /dev/null
          cp host/install.ps1 host/uninstall.ps1 host/claude-mon-*.ps1 _site/
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
