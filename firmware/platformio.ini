; claude-mon firmware for the ESP32-2432S028R ("Cheap Yellow Display").
; One build covers both board versions; the screen controller is detected at boot.
;   pio run -t upload && pio device monitor
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#1.1.16
  https://github.com/bblanchon/ArduinoJson.git#v7.2.0
