; claude-mon firmware for the ESP32-2432S028R ("Cheap Yellow Display").
; Two-port boards (USB-C + micro-USB) usually need env:cyd2usb; one-port boards env:cyd.
;   pio run -e cyd2usb -t upload && pio device monitor
[platformio]
default_envs = cyd2usb

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#1.1.16
  https://github.com/bblanchon/ArduinoJson.git#v7.2.0

[env:cyd2usb]
build_flags = -DPANEL_ST7789 -DPANEL_INVERT=0

[env:cyd]
build_flags = -DPANEL_INVERT=0
